<svg xmlns="http://www.w3.org/2000/svg" width="512" height="300" viewBox="0 0 512 300" shape-rendering="crispEdges">
  <title>车辆导入台选择预览页面布局蒙版 512x300</title>
  <desc>透明的 1:1 校准蒙版。标出选择页面面板、返回按钮、标题、十二列七行部件网格、翻页区，以及附件选择页面专用按钮。</desc>
  <defs>
    <pattern id="selection-entry-grid" x="90" y="50" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="23" height="23" fill="#2997ff" fill-opacity="0.16" stroke="#147dd1"/>
      <rect x="4.5" y="4.5" width="15" height="15" fill="none" stroke="#147dd1" stroke-opacity="0.55"/>
    </pattern>
    <style>
      .panel{fill:#38b26c;fill-opacity:.08;stroke:#238b50}
      .control{fill:#ff922b;fill-opacity:.15;stroke:#e56f00}
      .text{fill:#8d63e6;fill-opacity:.12;stroke:#7445cc;stroke-dasharray:3 2}
      .optional{fill:#e83e8c;fill-opacity:.12;stroke:#e83e8c;stroke-dasharray:3 2}
    </style>
  </defs>

  <!-- 游戏始终绘制的标题/状态动态文字行。 -->
  <path class="text" d="M7.5 7.5H503.5V18.5H7.5Z"/>

  <!-- SELECTION 九宫格背景的实际绘制范围：[5,507) × [22,295)。 -->
  <rect class="panel" x="5.5" y="22.5" width="501" height="272"/>

  <!-- 返回按钮。 -->
  <rect class="control" x="8.5" y="24.5" width="53" height="19"/>

  <!-- 页面标题：以 x=256 居中，文字宽度随选择类型及语言变化。 -->
  <path class="text" d="M127.5 30.5H384.5V41.5H127.5Z"/>

  <!-- 最多 84 个入口：12 列 × 7 行；按钮 24×24，间距 4；内部 16×16 为物品渲染区。 -->
  <rect x="90" y="50" width="332" height="192" fill="url(#selection-entry-grid)"/>

  <!-- 翻页按钮及页码文字。 -->
  <rect class="control" x="190.5" y="271.5" width="27" height="19"/>
  <path class="text" d="M222.5 276.5H289.5V287.5H222.5Z"/>
  <rect class="control" x="294.5" y="271.5" width="27" height="19"/>

  <!-- 仅前/后附件名单选择页面显示。 -->
  <rect class="optional" x="8.5" y="271.5" width="53" height="19"/>
  <rect class="optional" x="66.5" y="271.5" width="53" height="19"/>
</svg>
