<svg xmlns="http://www.w3.org/2000/svg" width="512" height="300" viewBox="0 0 512 300" shape-rendering="crispEdges">
  <title>车辆导入台程序布局蒙版 512x300</title>
  <desc>无文字的 1:1 游戏校准蒙版。蓝色为主标签，橙色为动态控件，绿色为车辆预览裁剪区，紫色为动态文字，粉色为物品槽。</desc>
  <defs>
    <g id="slot">
      <rect x="0.5" y="0.5" width="17" height="17" fill="#e83e8c" fill-opacity="0.14" stroke="#e83e8c"/>
      <rect x="1.5" y="1.5" width="15" height="15" fill="none" stroke="#e83e8c" stroke-opacity="0.5"/>
    </g>
    <style>
      .tab{fill:#2997ff;fill-opacity:.17;stroke:#147dd1}
      .ctl{fill:#ff922b;fill-opacity:.15;stroke:#e56f00}
      .view{fill:#38b26c;fill-opacity:.10;stroke:#238b50}
      .txt{fill:#8d63e6;fill-opacity:.12;stroke:#7445cc;stroke-dasharray:3 2}
    </style>
  </defs>

  <!-- 标题与状态共用动态文字行；标题从 (8,8) 开始，具体宽度取决于语言。 -->
  <path class="txt" d="M7.5 7.5H503.5V18.5H7.5Z"/>

  <!-- 左侧主标签。 -->
  <rect class="tab" x="7.5" y="24.5" width="51" height="31"/>
  <rect class="tab" x="7.5" y="60.5" width="51" height="31"/>
  <rect class="tab" x="7.5" y="96.5" width="51" height="31"/>

  <!-- 外壳页子标签。 -->
  <rect class="ctl" x="70.5" y="25.5" width="42" height="19"/>
  <rect class="ctl" x="115.5" y="25.5" width="42" height="19"/>
  <rect class="ctl" x="160.5" y="25.5" width="42" height="19"/>
  <rect class="ctl" x="205.5" y="25.5" width="42" height="19"/>
  <rect class="ctl" x="250.5" y="25.5" width="45" height="19"/>

  <!-- 基础页：标签区 + 动态控件区。 -->
  <rect class="txt" x="70.5" y="49.5" width="65" height="19"/>
  <rect class="ctl" x="140.5" y="49.5" width="155" height="19"/>
  <rect class="txt" x="70.5" y="73.5" width="65" height="19"/>
  <rect class="ctl" x="140.5" y="73.5" width="155" height="19"/>
  <rect class="txt" x="70.5" y="97.5" width="65" height="19"/>
  <rect class="ctl" x="140.5" y="97.5" width="155" height="19"/>
  <rect class="txt" x="70.5" y="121.5" width="65" height="19"/>
  <rect class="ctl" x="140.5" y="121.5" width="155" height="19"/>
  <rect class="txt" x="70.5" y="145.5" width="65" height="19"/>
  <rect class="ctl" x="140.5" y="145.5" width="155" height="19"/>
  <rect class="ctl" x="70.5" y="169.5" width="73" height="19"/>
  <rect class="ctl" x="146.5" y="169.5" width="73" height="19"/>
  <rect class="ctl" x="222.5" y="169.5" width="73" height="19"/>

  <!-- 预览裁剪区：代码边界 [304,507) × [22,295)。 -->
  <rect class="view" x="304.5" y="22.5" width="202" height="272"/>
  <rect class="ctl" x="310.5" y="26.5" width="71" height="17"/>

  <!-- 玩家背包标签锚点。 -->
  <path class="txt" d="M69.5 204.5H135.5V215.5H69.5Z"/>

  <!-- 背包：槽位背景 18x18，物品区为其内侧 16x16。 -->
  <g>
    <use href="#slot" x="69" y="217"/><use href="#slot" x="87" y="217"/><use href="#slot" x="105" y="217"/><use href="#slot" x="123" y="217"/><use href="#slot" x="141" y="217"/><use href="#slot" x="159" y="217"/><use href="#slot" x="177" y="217"/><use href="#slot" x="195" y="217"/><use href="#slot" x="213" y="217"/>
    <use href="#slot" x="69" y="235"/><use href="#slot" x="87" y="235"/><use href="#slot" x="105" y="235"/><use href="#slot" x="123" y="235"/><use href="#slot" x="141" y="235"/><use href="#slot" x="159" y="235"/><use href="#slot" x="177" y="235"/><use href="#slot" x="195" y="235"/><use href="#slot" x="213" y="235"/>
    <use href="#slot" x="69" y="253"/><use href="#slot" x="87" y="253"/><use href="#slot" x="105" y="253"/><use href="#slot" x="123" y="253"/><use href="#slot" x="141" y="253"/><use href="#slot" x="159" y="253"/><use href="#slot" x="177" y="253"/><use href="#slot" x="195" y="253"/><use href="#slot" x="213" y="253"/>
    <use href="#slot" x="69" y="275"/><use href="#slot" x="87" y="275"/><use href="#slot" x="105" y="275"/><use href="#slot" x="123" y="275"/><use href="#slot" x="141" y="275"/><use href="#slot" x="159" y="275"/><use href="#slot" x="177" y="275"/><use href="#slot" x="195" y="275"/><use href="#slot" x="213" y="275"/>
  </g>

  <!-- 导出物品按钮、输出标签与输出槽。 -->
  <rect class="ctl" x="238.5" y="218.5" width="57" height="19"/>
  <path class="txt" d="M247.5 243.5H286.5V254.5H247.5Z"/>
  <use href="#slot" x="258" y="255"/>
</svg>
